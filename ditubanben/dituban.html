<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>欢乐美食地图</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; font-family:"PingFang SC","Microsoft YaHei",sans-serif; }
  #map { width:100%; height:100%; }

  /* 顶部标题栏 */
  .title-bar {
    position:absolute; top:0; left:0; right:0; z-index:1000;
    background:linear-gradient(135deg,#c0392b,#e74c3c);
    color:#fff; padding:12px 20px; text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.3);
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .title-bar h1 { font-size:20px; font-weight:600; letter-spacing:2px; }
  .title-bar .food-icon { font-size:24px; }

  /* ===== 地图样式切换按钮 ===== */
  .style-switcher {
    position:absolute; top:70px; left:20px; z-index:1000;
    display:flex; background:#fff; border-radius:24px;
    box-shadow:0 2px 12px rgba(0,0,0,.18); overflow:hidden;
  }
  .style-btn {
    padding:9px 20px; border:none; background:transparent;
    font-size:14px; font-weight:600; cursor:pointer; color:#999;
    transition:all .25s; white-space:nowrap;
  }
  .style-btn.active {
    background:linear-gradient(135deg,#c0392b,#e74c3c); color:#fff;
  }
  .style-btn:not(.active):hover { background:#f9f0f0; color:#c0392b; }

  /* 侧边栏 */
  .sidebar {
    position:fixed; top:0; right:-480px; width:440px; max-width:90vw;
    height:100%; background:#fff; z-index:2000;
    box-shadow:-4px 0 20px rgba(0,0,0,.2);
    transition:right .35s cubic-bezier(.4,0,.2,1);
    display:flex; flex-direction:column; overflow-y:auto;
  }
  .sidebar.open { right:0; }
  .sidebar-overlay {
    position:fixed; top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,.3); z-index:1999; display:none;
  }
  .sidebar-overlay.show { display:block; }
  .sidebar-header {
    color:#fff; padding:20px; position:sticky; top:0; z-index:10;
  }
  .sidebar-header.cat-dacan { background:linear-gradient(135deg,#c0392b,#e74c3c); }
  .sidebar-header.cat-xiaodian { background:linear-gradient(135deg,#2471a3,#2e86c1); }
  .sidebar-header.cat-tianshui { background:linear-gradient(135deg,#7d3c98,#a569bd); }
  .sidebar-header h2 { font-size:22px; margin-bottom:6px; }
  .sidebar-close {
    position:absolute; top:15px; right:15px; background:rgba(255,255,255,.2);
    border:none; color:#fff; width:32px; height:32px; border-radius:50%;
    font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .sidebar-close:hover { background:rgba(255,255,255,.4); }
  .sidebar-body { padding:20px; flex:1; }
  .info-section { margin-bottom:20px; }
  .info-label {
    font-size:13px; color:#999; margin-bottom:6px;
    display:flex; align-items:center; gap:6px;
  }
  .info-label::before { content:''; width:3px; height:14px; border-radius:2px; }
  .cat-dacan .info-label::before, .sidebar-body.cat-dacan .info-label::before { background:#e74c3c; }
  .cat-xiaodian .info-label::before, .sidebar-body.cat-xiaodian .info-label::before { background:#2e86c1; }
  .cat-tianshui .info-label::before, .sidebar-body.cat-tianshui .info-label::before { background:#a569bd; }
  .info-value { font-size:15px; color:#333; line-height:1.6; padding-left:9px; }
  .info-value a { color:#e74c3c; text-decoration:none; }
  .dish-tag {
    display:inline-block; padding:4px 12px; border-radius:20px; font-size:13px; margin:3px 4px 3px 0;
  }
  .cat-dacan .dish-tag, .dish-tag.cat-dacan { background:#fef0ef; color:#c0392b; border:1px solid #f5c6c0; }
  .cat-xiaodian .dish-tag, .dish-tag.cat-xiaodian { background:#ebf5fb; color:#2471a3; border:1px solid #aed6f1; }
  .cat-tianshui .dish-tag, .dish-tag.cat-tianshui { background:#f5eef8; color:#7d3c98; border:1px solid #d7bde2; }
  .note-box {
    border-left:3px solid #f0ad4e;
    padding:10px 14px; border-radius:4px; font-size:14px; color:#8a6d3b;
    line-height:1.6; background:#fff9e6;
  }

  /* 图片画廊 */
  .gallery-section { margin-bottom:20px; }
  .gallery-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .gallery-item {
    position:relative; padding-top:100%; border-radius:8px; overflow:hidden;
    background:#f5f5f5; cursor:pointer;
  }
  .gallery-item img {
    position:absolute; top:0; left:0; width:100%; height:100%;
    object-fit:cover; transition:transform .3s;
  }
  .gallery-item:hover img { transform:scale(1.08); }
  .gallery-placeholder {
    position:absolute; top:0; left:0; width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#ccc; font-size:12px; gap:4px;
  }
  .gallery-placeholder svg { width:32px; height:32px; opacity:.4; }

  /* 灯箱 */
  .lightbox {
    position:fixed; top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,.9); z-index:3000; display:none;
    align-items:center; justify-content:center;
  }
  .lightbox.show { display:flex; }
  .lightbox img { max-width:90%; max-height:90%; border-radius:8px; }
  .lightbox-close {
    position:absolute; top:20px; right:20px; background:rgba(255,255,255,.2);
    border:none; color:#fff; width:40px; height:40px; border-radius:50%;
    font-size:24px; cursor:pointer;
  }
  .lightbox-nav {
    position:absolute; top:50%; transform:translateY(-50%);
    background:rgba(255,255,255,.2); border:none; color:#fff;
    width:44px; height:44px; border-radius:50%; font-size:20px; cursor:pointer;
  }
  .lightbox-prev { left:20px; }
  .lightbox-next { right:20px; }

  /* ===== 标准版 水滴pin标记 ===== */
  .food-marker {
    position:relative; width:36px; height:44px;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.3));
    cursor:pointer; transition:transform .2s;
  }
  .food-marker:hover { transform:scale(1.15); }
  .food-marker svg { width:100%; height:100%; }

  /* ===== 极速版 文字标签标记 ===== */
  .label-marker {
    white-space:nowrap; cursor:pointer;
    display:inline-flex; align-items:center; gap:4px;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    transition:transform .15s;
    background:rgba(255,255,255,.72);
    padding:2px 8px 2px 6px; border-radius:10px;
    backdrop-filter:blur(2px);
  }
  .label-marker:hover { transform:scale(1.12); z-index:999 !important; }
  .label-dot {
    width:8px; height:8px; border-radius:50%; flex-shrink:0;
  }
  .label-text {
    font-size:13px; font-weight:600; line-height:1.2;
  }
  .label-marker.cat-dacan .label-dot { background:#e74c3c; }
  .label-marker.cat-dacan .label-text { color:#c0392b; }
  .label-marker.cat-xiaodian .label-dot { background:#2e86c1; }
  .label-marker.cat-xiaodian .label-text { color:#1a5276; }
  .label-marker.cat-tianshui .label-dot { background:#a569bd; }
  .label-marker.cat-tianshui .label-text { color:#6c3483; }
  .label-marker.stall { border:1px dashed #f39c12; }
  .label-marker.stall .label-dot { background:#f39c12; }
  .label-marker.stall .label-text { color:#d68910; }

  /* 欢乐谷 极速版 地标 */
  .landmark-label {
    white-space:nowrap; text-align:center; cursor:pointer;
  }
  .landmark-label .lm-name {
    font-size:18px; font-weight:800; color:#d4a017;
    text-shadow:0 1px 3px rgba(255,255,255,.9),0 0 8px rgba(255,255,255,.8);
    letter-spacing:2px;
  }
  .landmark-label .lm-sub {
    font-size:11px; color:#b8860b; margin-top:2px;
    text-shadow:0 1px 2px rgba(255,255,255,.9);
  }

  /* 极速版：使用艺术底图叠层，不使用滤镜，避免卡顿 */
  .art-map { background:#faf6f0; }
  .art-map .leaflet-tile { opacity:0.12; }
  .art-overlay { pointer-events:none; }

  /* 图例 */
  .legend {
    position:absolute; bottom:20px; left:20px; z-index:1000;
    background:#fff; border-radius:10px; padding:12px 16px;
    box-shadow:0 2px 10px rgba(0,0,0,.15); font-size:13px;
  }
  .legend-title { font-weight:600; margin-bottom:8px; color:#333; }
  .legend-item { display:flex; align-items:center; gap:8px; margin:5px 0; }
  .legend-icon { width:22px; display:flex; justify-content:center; }

  /* 列表按钮 */
  .list-btn {
    position:absolute; top:70px; right:20px; z-index:1000;
    background:#fff; border:none; padding:10px 18px; border-radius:24px;
    box-shadow:0 2px 10px rgba(0,0,0,.15); cursor:pointer; font-size:14px;
    color:#c0392b; font-weight:600; display:flex; align-items:center; gap:6px;
    transition:transform .2s;
  }
  .list-btn:hover { transform:scale(1.05); }

  /* 店铺列表面板 */
  .shop-list-panel {
    position:fixed; top:0; left:-360px; width:340px; max-width:85vw;
    height:100%; background:#fff; z-index:2000;
    box-shadow:4px 0 20px rgba(0,0,0,.2);
    transition:left .35s cubic-bezier(.4,0,.2,1);
    display:flex; flex-direction:column;
  }
  .shop-list-panel.open { left:0; }
  .shop-list-header {
    background:linear-gradient(135deg,#c0392b,#e74c3c);
    color:#fff; padding:20px; font-size:18px; font-weight:600;
    display:flex; justify-content:space-between; align-items:center;
  }
  .shop-list-close {
    background:rgba(255,255,255,.2); border:none; color:#fff;
    width:28px; height:28px; border-radius:50%; cursor:pointer; font-size:16px;
  }
  .shop-list-body { flex:1; overflow-y:auto; padding:8px 0; }
  .shop-list-item {
    padding:12px 20px; cursor:pointer; border-bottom:1px solid #f0f0f0;
    transition:background .15s;
  }
  .shop-list-item:hover { background:#fef5f5; }
  .shop-list-item .name { font-size:15px; color:#333; font-weight:500; }
  .shop-list-item .addr { font-size:12px; color:#999; margin-top:3px; }
  .shop-list-item .dish { font-size:12px; margin-top:3px; }
  .cat-dot {
    display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:middle;
  }
  .cat-dot.dacan { background:#e74c3c; }
  .cat-dot.xiaodian { background:#2e86c1; }
  .cat-dot.tianshui { background:#a569bd; }
  .dish-text-dacan { color:#c0392b; }
  .dish-text-xiaodian { color:#2471a3; }
  .dish-text-tianshui { color:#7d3c98; }

  ::-webkit-scrollbar { width:6px; }
  ::-webkit-scrollbar-thumb { background:#ddd; border-radius:3px; }
  ::-webkit-scrollbar-thumb:hover { background:#bbb; }

  @keyframes pulse {
    0% { transform:scale(1); opacity:.4; }
    70% { transform:scale(1.8); opacity:0; }
    100% { transform:scale(1.8); opacity:0; }
  }

  @media (max-width:600px) {
    .sidebar { width:100%; max-width:100%; right:-100%; }
    .gallery-grid { grid-template-columns:repeat(2,1fr); }
    .title-bar h1 { font-size:17px; }
    .style-btn { padding:8px 14px; font-size:13px; }
  }
</style>
</head>

<button class="list-btn" onclick="toggleShopList()">

  </div>

  <div class="legend-item">

    <span><span class="cat-dot tianshui"></span>糖水·下午茶·酒吧</span>
  </div>
</div>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<div class="sidebar" id="sidebar">
  <div class="sidebar-header cat-dacan" id="sbHeader">
    <button class="sidebar-close" onclick="closeSidebar()">✕</button>
    <h2 id="sbName"></h2>
    <div id="sbCategory" style="font-size:13px;opacity:.85;"></div>
  </div>
  <div class="sidebar-body cat-dacan" id="sbBody">
    <div class="gallery-section" id="sbGallery"></div>
    <div class="info-section">
      <div class="info-label">📍 地址</div>
      <div class="info-value" id="sbAddress"></div>
    </div>
    <div class="info-section" id="sbHoursSection">
      <div class="info-label">🕐 营业时间</div>
      <div class="info-value" id="sbHours"></div>
    </div>
    <div class="info-section" id="sbPhoneSection">
      <div class="info-label">📞 电话</div>
      <div class="info-value" id="sbPhone"></div>
    </div>
    <div class="info-section" id="sbDishSection">
      <div class="info-label">🍽️ 招牌菜</div>
      <div class="info-value" id="sbDishes"></div>
    </div>
    <div class="info-section" id="sbNoteSection" style="display:none;">
      <div class="info-label">💬 食评</div>
      <div class="note-box" id="sbNote"></div>
    </div>
  </div>
</div>

<div class="shop-list-panel" id="shopListPanel">
  <div class="shop-list-header">
    <span>🍴 全部美食 (<span id="shopCount"></span>)</span>
    <button class="shop-list-close" onclick="toggleShopList()">✕</button>
  </div>
  <div class="shop-list-body" id="shopListBody"></div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <button class="lightbox-nav lightbox-prev" onclick="event.stopPropagation();prevLightbox()">‹</button>
  <img id="lightboxImg" src="" alt="">
  <button class="lightbox-nav lightbox-next" onclick="event.stopPropagation();nextLightbox()">›</button>
</div>

    html: '<div class="food-marker">' +
      '<svg viewBox="0 0 36 44" xmlns="http://www.w3.org/2000/svg">' +
      '<defs><linearGradient id="'+gid+'" x1="0%" y1="0%" x2="0%" y2="100%">' +
      '<stop offset="0%" style="stop-color:'+colorLight+'"/>' +
      '<stop offset="100%" style="stop-color:'+color+'"/>' +
      '</linearGradient></defs>' +
      '<path d="M18 0C8 0 0 8 0 18c0 12 18 26 18 26s18-14 18-26C36 8 28 0 18 0z" fill="url(#'+gid+')"/>' +
      (isStall ? '<path d="M18 0C8 0 0 8 0 18c0 12 18 26 18 26s18-14 18-26C36 8 28 0 18 0z" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="3,2"/>' : '') +

      '<text x="18" y="22" text-anchor="middle" font-size="15" dominant-baseline="middle">'+r.icon+'</text>' +
      '</svg></div>',
    iconSize: [36,44], iconAnchor: [18,42], popupAnchor: [0,-40]
  });
}

function createLabelIcon(r) {
  const isStall = r.stall;

  return L.divIcon({
    className: '',
    html: '<div class="label-marker '+catClass+'">' +
      '<span class="label-dot"></span>' +

}

const markers = {};
const standardMarkers = {};
const artMarkers = {};

restaurants.forEach(r => {

  const mStd = L.marker([r.lat, r.lng], {
    icon: createPinIcon(r),

  });

  // 极速版
  const mArt = L.marker([r.lat, r.lng], {
    icon: createLabelIcon(r),
    title: r.name
  });
  mArt.on('click', () => openSidebar(r));
  mArt.addTo(artLayer);
  artMarkers[r.id] = mArt;

  markers[r.id] = mStd;
});

// ========== 样式切换 ==========
function switchMapStyle(style) {
  if (style === currentStyle) return;
  currentStyle = style;

  document.querySelectorAll('.style-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.style === style);
  });

  const mapEl = document.getElementById('map');
  if (style === 'art') {
    map.removeLayer(standardLayer);
    artLayer.addTo(map);
    artOverlay.addTo(map);
    mapEl.classList.add('art-map');
  } else {
    map.removeLayer(artLayer);
    standardLayer.addTo(map);
    map.removeLayer(artOverlay);
    mapEl.classList.remove('art-map');
  }
}

function openSidebar(r) {
  const cfg = CAT_CONFIG[r.cat];
  const header = document.getElementById('sbHeader');
  const body = document.getElementById('sbBody');
  header.className = 'sidebar-header cat-'+r.cat;
  body.className = 'sidebar-body cat-'+r.cat;

  document.getElementById('sbName').textContent = r.name;
  document.getElementById('sbCategory').textContent =

  document.getElementById('sbAddress').textContent = r.address;
  document.getElementById('sbHours').textContent = r.hours || '暂无数据';
  document.getElementById('sbPhone').innerHTML = r.phone
    ? '<a href="tel:'+r.phone+'">'+r.phone+'</a>' : '暂无数据';

  const dishContainer = document.getElementById('sbDishes');
  dishContainer.innerHTML = r.dishes.map(d =>
    '<span class="dish-tag cat-'+r.cat+'">'+d+'</span>'
  ).join('');

  const noteSection = document.getElementById('sbNoteSection');
  if (r.note) {
    noteSection.style.display = 'block';
    document.getElementById('sbNote').textContent = r.note;
  } else {
    noteSection.style.display = 'none';
  }

  // 画廊
  const gallery = document.getElementById('sbGallery');
  gallery.innerHTML =
    '<div class="info-label">📷 美食图片</div>' +
    '<div class="gallery-grid">' +

      const idx=i+1;

        '<img src="images/'+r.id+'_'+idx+'.jpg" alt="'+r.name+'-'+idx+'" ' +
        'onerror="this.style.display=\'none\';this.parentElement.querySelector(\'.ph\').style.display=\'flex\'">' +
        '<div class="gallery-placeholder ph" style="display:none;">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">' +
        '<rect x="3" y="3" width="18" height="18" rx="2"/>' +
        '<circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>' +
        '<span>待上传</span></div></div>';
    }).join('') +
    '</div>' +
    '<div style="font-size:11px;color:#bbb;margin-top:8px;padding-left:9px;">' +
    '图片放入 images/ 文件夹，命名格式：'+r.id+'_1.jpg ~ '+r.id+'_6.jpg</div>';

  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarOverlay').classList.add('show');

// ========== 灯箱 ==========
function openLightbox(id, index) {
  const img = document.getElementById('lightboxImg');
  const src = 'images/'+id+'_'+index+'.jpg';
  const testImg = new Image();
  testImg.onload = function() {
    img.src = src;
    currentGalleryImages = Array.from({length:6},(_,i)=>'images/'+id+'_'+(i+1)+'.jpg');
    currentGalleryIndex = index - 1;
    document.getElementById('lightbox').classList.add('show');
  };
  testImg.onerror = function() {};
  testImg.src = src;
}
function closeLightbox(e) {
  if (e && e.target.tagName === 'IMG') return;
  document.getElementById('lightbox').classList.remove('show');
}
function prevLightbox() {
  currentGalleryIndex = (currentGalleryIndex - 1 + 6) % 6;
  const img = document.getElementById('lightboxImg');
  const parts = img.src.split('/');
  const id = parseInt(parts[parts.length-1]);
  img.src = 'images/'+id+'_'+(currentGalleryIndex+1)+'.jpg';
}
function nextLightbox() {
  currentGalleryIndex = (currentGalleryIndex + 1) % 6;
  const img = document.getElementById('lightboxImg');
  const parts = img.src.split('/');
  const id = parseInt(parts[parts.length-1]);
  img.src = 'images/'+id+'_'+(currentGalleryIndex+1)+'.jpg';
}

  const body = document.getElementById('shopListBody');
  body.innerHTML = restaurants.map(r => {
    const stallTag = r.stall ? ' <span style="font-size:11px;color:#f39c12;">[摊位]</span>' : '';
    return '<div class="shop-list-item" onclick="focusShop('+r.id+')">' +
      '<div class="name"><span class="cat-dot '+r.cat+'"></span>'+r.icon+' '+r.name+stallTag+'</div>' +
      '<div class="addr">'+r.address.substring(0,30)+(r.address.length>30?'...':'')+'</div>' +
      '<div class="dish dish-text-'+r.cat+'">'+r.dishes.slice(0,2).join(' / ')+'</div>' +
      '</div>';
  }).join('');
}
function focusShop(id) {
  const r = restaurants.find(x => x.id === id);
  if (!r) return;
  map.setView([r.lat, r.lng], 16, { animate:true });
  openSidebar(r);
  document.getElementById('shopListPanel').classList.remove('open');
}
buildShopList();

// 键盘
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    closeSidebar();
    closeLightbox();
    document.getElementById('shopListPanel').classList.remove('open');
  }
  if (document.getElementById('lightbox').classList.contains('show')) {
    if (e.key === 'ArrowLeft') prevLightbox();
    if (e.key === 'ArrowRight') nextLightbox();
  }
});
</script>
</body>
</html>
