<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>加加美食地图</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #f5f0eb;
            display: flex;
            justify-content: center;
            font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        .map-wrapper {
            width: 100%;
            max-width: 430px;
            background: #fff;
            position: relative;
            height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }

        .map-wrapper::-webkit-scrollbar { width: 0; height: 0; }
        .map-wrapper { scrollbar-width: none; }

        .map-image {
            display: block;
            width: 100%;
            height: auto;
            user-select: none;
            pointer-events: none;
        }

        /* 热键基础样式 */
        .shop-hotspot {
            position: absolute;
            border-radius: 50%;
            background: transparent;
            cursor: pointer;
            transform: translate(-50%, -50%);
            transition: transform 0.2s ease;
            border: none;
            outline: none;
            z-index: 10;
        }

        .shop-hotspot:active {
            transform: translate(-50%, -50%) scale(0.95);
        }

        /* 调试模式：红圈 */
        .shop-hotspot.debug {
            background: rgba(255, 0, 0, 0) !important;
            border: 0px solid red !important;
        }

        /* 弹窗 */
        .popup-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 20px;
        }
        .popup-overlay.active { display: flex; }

        .popup-card {
            background: #fff;
            border-radius: 28px;
            max-width: 340px;
            width: 100%;
            padding: 30px 24px 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideUp 0.3s ease;
        }

        .popup-card .shop-name {
            font-size: 22px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 6px;
        }

        .popup-card .shop-tag {
            display: inline-block;
            font-size: 12px;
            color: #ff6b4a;
            background: #fff0eb;
            padding: 2px 12px;
            border-radius: 20px;
            margin-bottom: 14px;
        }

        .popup-card .dish-list {
            margin: 12px 0 18px;
            padding-left: 0;
            list-style: none;
        }

        .popup-card .dish-list li {
            font-size: 15px;
            color: #333;
            padding: 6px 0;
            border-bottom: 1px solid #f0edea;
            display: flex;
            align-items: center;
        }

        .popup-card .dish-list li::before {
            content: '•';
            color: #ff6b4a;
            font-weight: bold;
            font-size: 20px;
            margin-right: 10px;
        }

        .popup-card .dish-list li:last-child { border-bottom: none; }

        .popup-card .close-btn {
            display: block;
            width: 100%;
            padding: 12px 0;
            margin-top: 12px;
            background: #f5f0eb;
            border: none;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 500;
            color: #555;
            cursor: pointer;
            text-align: center;
        }

        @keyframes slideUp {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .scroll-tip {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(6px);
            color: #fff;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 13px;
            opacity: 0.7;
            z-index: 50;
            pointer-events: none;
            white-space: nowrap;
        }
        /* 设计卡片样式 */
        .card {
            position: fixed;
            top: 30px;
            left: 45%;
            transform: translateX(-50%);
            background: rgba(161, 161, 161, 0.3);
            backdrop-filter: blur(6px);
            color: #fff;
            padding: 30px;
            border-radius: 15px;      /* 圆角 */
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); /* 阴影 */
            font-size: 13px;
            text-align: center;
            }
    </style>
</head>
<body>
    <div class="map-wrapper" id="mapWrapper">
        <img src="ditu1.jpg" alt="美食地图" class="map-image" id="mapImage">

        <!-- 店铺热键：调试模式已开启，红圈会显示 -->
        <button class="shop-hotspot debug" data-x="70" data-y="8"
            data-name="顺德公猪肚鸡"
            data-dishes="胡椒猪肚鸡"
            style="width: 200px; height: 200px;"></button>
        
        <button class="shop-hotspot debug" data-x="70" data-y="35"
            data-name="爽爽糖水"
            data-dishes="绿豆海底椰糖水|杨枝甘露|斑斓河粉|牛奶冰"
            style="width: 200px; height: 200px;"></button>

        <button class="shop-hotspot debug" data-x="25" data-y="50"
            data-name="亮哥牛杂"
            data-dishes="本人在深圳吃过最好吃的牛杂，很干净，沙茶味道浓郁，花生油很香"
            style="width: 200px; height: 200px;"></button>

        <button class="shop-hotspot debug" data-x="80" data-y="65"
            data-name="李记湛光蚝莊"
            data-dishes="蒜蓉生蚝|芝士生蚝|炒米粉|徐闻菠萝"
            style="width: 200px; height: 200px;"></button>

        <button class="shop-hotspot debug" data-x="30" data-y="20"
            data-name="小龍牛肉面"
            data-dishes="来一份幺拖幺加豌豆黄实在是太美妙啦"
            style="width: 200px; height: 200px;"></button>

        <button class="shop-hotspot debug" data-x="20" data-y="70"
            data-name="蛇口吴记鸡煲·脆皮鸡"
            data-dishes="美食指南|烤鸡：烤鸡上桌切忌拍照，要立刻开始撕咬鸡腿！|它的外皮像玻璃纸一样酥脆，鸡肉嫩滑多汁，沾一些辣椒粉，简直是美味极了，这时候再喝一口老盐黄皮汁，会感到十分地满足！！
            |无花果鸡煲|老盐黄皮汁|推荐蘸料：拿若干小青柠汁打底，放香菜梗，加一勺小米辣，加一勺酱油，蘸鸡味道绝美"
            style="width: 200px; height: 200px;"></button>

        <button class="shop-hotspot debug" data-x="20" data-y="100"
            data-name="香蜜轩"
            data-dishes="蚝仔烙：和我在漳州古城吃到的一样|忘不了鱼:鱼如其名，脆鳞果香鱼|海鲜自助餐，这家蘸料里的蒜蓉比较好吃"
            style="width: 200px; height: 200px;"></button>

        <button class="shop-hotspot debug" data-x="75" data-y="135"
            data-name="新疆餐厅"
            data-dishes="我最喜欢在新疆餐厅吃一些帕米尔高原上的小羊羔了|烤羊肉串|干煸炒面|新疆炒米粉|馕包肉：好好吃呀，非常juicy的肉，搭配香香的馕|大盘鸡"
            style="width: 200px; height: 200px;"></button>

        <button class="shop-hotspot debug" data-x="30" data-y="150"
            data-name="辉记牛肉店"
            data-dishes="五花趾粿条|吊龙粿条|牛百叶|胸口油|这家的沙茶酱好吃得很突出，小米辣也剁得细细的，如果在家自制调料，可以学习这种方式。|
            我一般点一份吊龙粿条，拿两个小碗。|
            一个放一勺小米辣，放一勺芹菜梗，两勺花生芝麻酱，一勺沙茶酱（注意这里一定要先放芝麻花生酱再放沙茶酱）。|
            粿条上了以后先吃肉，这时的肉是最嫩的，
            同时把粿条捞到另一个小碗里晾凉，喝几口牛肉汤以后，把第一个小碗里的调料蒯到第二个小碗的粿条里，芝麻的香气会和粿条完美融合。"
            style="width: 200px; height: 200px;"></button>

        <button class="shop-hotspot debug" data-x="80" data-y="160"
            data-name="汕头辉记肠粉王"
            data-dishes="青菜肠粉|芝麻酱拌粿条"
            style="width: 200px; height: 200px;"></button>

        <button class="shop-hotspot debug" data-x="75" data-y="210"
            data-name="潮悦粉面店"
            data-dishes="是自选配菜、主食、做法的美味小店"
            style="width: 200px; height: 200px;"></button>

        <button class="shop-hotspot debug" data-x="30" data-y="175"
            data-name="Peng's Cafe"
            data-dishes="酸菜炒五花趾|客家八刀汤：这家的酱油好吃，猪肉食材很新鲜，很脆，有坚果香气"
            style="width: 200px; height: 200px;"></button>

        <button class="shop-hotspot debug" data-x="75" data-y="190"

            data-dishes="猪红汤|排骨蒸饭|鲜虾烧卖|叉烧包"
            style="width: 200px; height: 200px;"></button>

        <button class="shop-hotspot debug" data-x="30" data-y="195"
            data-name="云肴四季"
            data-dishes="百香果菠萝烤肉饭：百香果和菠萝搭配油滋滋的烤肉很香哦，一点也不腻|红三剁盖饭|小炒肉饭：我曾经在昆明火车站旁边吃过一家炒菜，回来深圳找了很久都没有那种味道，这道菜和它有些相似。花开两朵，各表一枝"
            style="width: 200px; height: 200px;"></button>

        <button class="shop-hotspot debug" data-x="30" data-y="225"
            data-name="潮汕牛肉 综合市场店"
            data-dishes="牛腩饭|沙茶拌面"
            style="width: 200px; height: 200px;"></button>
        
        <button class="shop-hotspot debug" data-x="75" data-y="265"
            data-name="潮巷·潮州粿条（华侨城店）"
            data-dishes="牛腩饭"
            style="width: 200px; height: 200px;"></button>
        
        <button class="shop-hotspot debug" data-x="75" data-y="235"
            data-name="光明乳鸽"
            data-dishes="鸽子汤|鸽子粥|红烧乳鸽|韭菜饺子"
            style="width: 200px; height: 200px;"></button>

        <button class="shop-hotspot debug" data-x="30" data-y="255"
            data-name="小西北"
            data-dishes="凉皮"
            style="width: 200px; height: 200px;"></button>
        
        <button class="shop-hotspot debug" data-x="30" data-y="310"
            data-name="央宗米线-出自云南"
            data-dishes="大理拌米线|小锅辣的|保山烧肉米线|豆花米线|这家的花椒酱很好吃"
            style="width: 200px; height: 200px;"></button>
    </div>

    <div class="popup-overlay" id="popupOverlay">
        <div class="popup-card">
            <div class="shop-name" id="popupName">店名</div>
            <div class="shop-tag">📌 推荐菜</div>
            <ul class="dish-list" id="popupDishes">
                <li>菜品1</li>
                <li>菜品2</li>
                <li>菜品3</li>
            </ul>
            <button class="close-btn" id="closePopup">☺ 知道啦，下次去吃</button>
        </div>
    </div>
    <div class="card"><a href="dituban.html">地图版本</a></div>

    <div class="scroll-tip">👆 上下滑动 · 点击店铺探索美食</div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const overlay = document.getElementById('popupOverlay');
            const popupName = document.getElementById('popupName');
            const popupDishes = document.getElementById('popupDishes');
            const closeBtn = document.getElementById('closePopup');

            function closePopup() {
                overlay.classList.remove('active');
                document.body.style.overflow = '';
            }

            closeBtn.addEventListener('click', closePopup);
            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) closePopup();
            });

            const hotspots = document.querySelectorAll('.shop-hotspot');

            hotspots.forEach(function(btn) {
                const x = btn.dataset.x;
                const y = btn.dataset.y;
                if (x !== undefined && y !== undefined) {
                    btn.style.left = x + '%';
                    btn.style.top = y + '%';
                }

                btn.addEventListener('click', function(e) {
                    e.stopPropagation();

                    const name = this.dataset.name || '未知店铺';
                    const dishesRaw = this.dataset.dishes || '推荐菜未录入';
                    const dishesArray = dishesRaw.split('|').filter(d => d.trim() !== '');

                    popupName.textContent = name;
                    popupDishes.innerHTML = '';
                    dishesArray.forEach(function(dish) {
                        const li = document.createElement('li');
                        li.textContent = dish.trim();
                        popupDishes.appendChild(li);
                    });

                    overlay.classList.add('active');
                    document.body.style.overflow = 'hidden';
                });
            });

            // 自动定位到地图中间
            function scrollToMiddle() {
                var wrapper = document.querySelector('.map-wrapper');
                if (!wrapper) return;
                var wrapperHeight = wrapper.scrollHeight;
                var windowHeight = wrapper.clientHeight;
                var targetScroll = (wrapperHeight - windowHeight) / 5;
                if (targetScroll < 0) targetScroll = 0;
                wrapper.scrollTo({ top: targetScroll, behavior: 'smooth' });
            }

            var mapImage = document.getElementById('mapImage');
            if (mapImage) {
                if (mapImage.complete) {
                    setTimeout(scrollToMiddle, 200);
                } else {
                    mapImage.addEventListener('load', function() {
                        setTimeout(scrollToMiddle, 200);
                    });
                }
            }

        });
    </script>
</body>
</html>
